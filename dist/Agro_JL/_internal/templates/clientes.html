<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes & Pets - Agro J&L</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans select-none">

    <!-- Barra Superior Verde e Branco -->
    <header class="bg-green-700 text-white px-8 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center gap-4">
            <div class="bg-white text-green-800 font-black px-4 py-2 rounded-xl text-2xl tracking-tight shadow-sm">
                AGRO J&L
            </div>
            <div>
                <h1 class="text-lg font-bold leading-tight">Clientes, Tutores & Pets</h1>
                <p class="text-xs text-green-100">Cadastro de Contatos, Endereços de Entrega e Animais</p>
            </div>
        </div>

        <nav class="flex items-center gap-3 text-base font-semibold">
            <a href="/pdv" class="text-green-100 hover:bg-green-600 px-4 py-2 rounded-lg transition">Vendas (PDV)</a>
            <a href="/clientes" class="bg-white text-green-800 px-4 py-2 rounded-lg shadow-sm">Clientes</a>
            <a href="/produtos" class="text-green-100 hover:bg-green-600 px-4 py-2 rounded-lg transition">Produtos & Granel</a>
            <a href="/caixa" class="text-green-100 hover:bg-green-600 px-4 py-2 rounded-lg transition">Caixa</a>
            <a href="/relatorios" class="text-green-100 hover:bg-green-600 px-4 py-2 rounded-lg transition">Relatórios</a>
        </nav>

        <div class="flex items-center gap-4">
            <div class="text-right">
                <p class="text-xs text-green-200" id="perfilOperadorHeader">Operador</p>
                <p class="font-bold text-base" id="nomeOperadorHeader">Admin</p>
            </div>
            <button onclick="trocarUsuario()" class="bg-green-800 hover:bg-amber-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs border border-green-500 transition shadow-sm">
                🔄 Trocar Usuário
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-6 max-w-7xl w-full mx-auto flex flex-col gap-6">

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
            <div class="flex-1 min-w-[280px]">
                <input type="text" id="filtroCliente" onkeyup="filtrarClientes()"
                    placeholder="🔍 Buscar cliente por nome, telefone, CPF, endereço ou nome do pet..."
                    class="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-green-600">
            </div>

            <button onclick="abrirModalCliente()"
                class="bg-green-600 hover:bg-green-700 text-white font-bold px-6 py-3.5 rounded-xl text-base shadow-sm transition flex items-center gap-2">
                + Novo Cliente
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex-1">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-green-50 border-b border-green-100 text-xs font-bold text-green-900 uppercase tracking-wider">
                        <th class="py-4 px-6">Cliente / Tutor</th>
                        <th class="py-4 px-4">Telefone / WhatsApp</th>
                        <th class="py-4 px-4">Endereço (Entrega)</th>
                        <th class="py-4 px-4">Pet (Nome / Espécie)</th>
                        <th class="py-4 px-6 text-center">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaClientes" class="divide-y divide-slate-100 text-base"></tbody>
            </table>
        </div>
    </main>

    <!-- MODAL: Cadastrar / Editar Cliente -->
    <div id="modalCliente" class="hidden fixed inset-0 bg-slate-900/60 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-200">
            <div class="flex justify-between items-center pb-4 border-b border-slate-100">
                <h2 id="tituloModalCliente" class="text-2xl font-black text-green-800">Cadastrar Novo Cliente</h2>
                <button onclick="fecharModalCliente()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">✕</button>
            </div>

            <form id="formCliente" onsubmit="salvarCliente(event)" class="mt-5 space-y-4">
                <input type="hidden" id="cliId">

                <div class="grid grid-cols-12 gap-4">
                    <div class="col-span-8">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Nome Completo do Cliente *</label>
                        <input type="text" id="cliNome" required placeholder="Ex: Carlos Eduardo Silva"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-medium">
                    </div>
                    <div class="col-span-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Telefone / WhatsApp</label>
                        <input type="text" id="cliTelefone" placeholder="(62) 99999-9999"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base font-medium">
                    </div>
                </div>

                <div class="grid grid-cols-12 gap-4">
                    <div class="col-span-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">CPF (Opcional)</label>
                        <input type="text" id="cliCpf" placeholder="000.000.000-00"
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base">
                    </div>
                    <div class="col-span-8">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Endereço Completo (Para Entregas)</label>
                        <input type="text" id="cliEndereco" placeholder="Rua, Quadra, Lote, Bairro..."
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base">
                    </div>
                </div>

                <div class="grid grid-cols-12 gap-4 pt-2 border-t border-slate-100">
                    <div class="col-span-6">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">🐾 Nome do Pet (Opcional)</label>
                        <input type="text" id="cliPet" placeholder="Ex: Thor, Mel, Bob..."
                            class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base">
                    </div>
                    <div class="col-span-6">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Espécie / Porte</label>
                        <select id="cliEspecie" class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base">
                            <option value="">Não informado</option>
                            <option value="Cão Pequeno">Cão - Porte Pequeno</option>
                            <option value="Cão Médio/Grande">Cão - Porte Médio/Grande</option>
                            <option value="Gato">Gato</option>
                            <option value="Ave / Roedor">Ave / Roedor / Peixe</option>
                            <option value="Animal de Grande Porte">Cavalo / Gado / Criação</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Observações (Ração preferida, vacinas, etc.)</label>
                    <input type="text" id="cliObs" placeholder="Ex: Compra ração Golden 15kg todo dia 10..."
                        class="w-full bg-slate-50 border border-slate-300 rounded-xl px-3.5 py-2.5 text-base">
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="fecharModalCliente()" class="px-6 py-3 rounded-xl border border-slate-300 font-bold text-slate-600">Cancelar</button>
                    <button type="submit" class="px-8 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white font-bold shadow-md">✔ Salvar Cliente</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        let listaClientes = [];

        async function carregarClientes() {
            const resp = await fetch('/api/clientes');
            listaClientes = await resp.json();
            renderizarClientes(listaClientes);
        }

        function renderizarClientes(clientes) {
            const tbody = document.getElementById('tabelaClientes');
            tbody.innerHTML = '';

            if (clientes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-slate-400">Nenhum cliente cadastrado ainda. Clique em "+ Novo Cliente" para começar.</td></tr>';
                return;
            }

            clientes.forEach(c => {
                const petInfo = c.nome_pet
                    ? '<span class="bg-green-50 text-green-800 border border-green-200 font-bold px-2.5 py-1 rounded-lg text-sm">🐾 ' + c.nome_pet + (c.especie_pet ? ' (' + c.especie_pet + ')' : '') + '</span>'
                    : '<span class="text-slate-400 text-sm">—</span>';

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML =
                    '<td class="py-4 px-6"><p class="font-bold text-slate-800">' + c.nome + '</p>' + (c.cpf ? '<p class="text-xs text-slate-400">CPF: ' + c.cpf + '</p>' : '') + '</td>' +
                    '<td class="py-4 px-4 font-medium text-slate-700">' + (c.telefone || '—') + '</td>' +
                    '<td class="py-4 px-4 text-sm text-slate-600">' + (c.endereco || '—') + '</td>' +
                    '<td class="py-4 px-4">' + petInfo + '</td>' +
                    '<td class="py-4 px-6 text-center">' +
                        '<button class="btn-editar text-green-700 hover:underline font-bold text-sm mr-3">Editar</button>' +
                        '<button class="btn-excluir text-rose-500 hover:underline font-bold text-sm">Excluir</button>' +
                    '</td>';

                tr.querySelector('.btn-editar').onclick = () => editarCliente(c);
                tr.querySelector('.btn-excluir').onclick = () => excluirCliente(c.id);
                tbody.appendChild(tr);
            });
        }

        function filtrarClientes() {
            const termo = document.getElementById('filtroCliente').value.toLowerCase();
            const filtrados = listaClientes.filter(c =>
                c.nome.toLowerCase().includes(termo) ||
                (c.telefone && c.telefone.toLowerCase().includes(termo)) ||
                (c.cpf && c.cpf.toLowerCase().includes(termo)) ||
                (c.endereco && c.endereco.toLowerCase().includes(termo)) ||
                (c.nome_pet && c.nome_pet.toLowerCase().includes(termo))
            );
            renderizarClientes(filtrados);
        }

        function abrirModalCliente() {
            document.getElementById('tituloModalCliente').innerText = 'Cadastrar Novo Cliente';
            document.getElementById('formCliente').reset();
            document.getElementById('cliId').value = '';
            document.getElementById('modalCliente').classList.remove('hidden');
        }

        function editarCliente(c) {
            document.getElementById('tituloModalCliente').innerText = 'Editar Cliente';
            document.getElementById('cliId').value = c.id;
            document.getElementById('cliNome').value = c.nome;
            document.getElementById('cliTelefone').value = c.telefone || '';
            document.getElementById('cliCpf').value = c.cpf || '';
            document.getElementById('cliEndereco').value = c.endereco || '';
            document.getElementById('cliPet').value = c.nome_pet || '';
            document.getElementById('cliEspecie').value = c.especie_pet || '';
            document.getElementById('cliObs').value = c.observacoes || '';
            document.getElementById('modalCliente').classList.remove('hidden');
        }

        function fecharModalCliente() {
            document.getElementById('modalCliente').classList.add('hidden');
        }

        async function salvarCliente(e) {
            e.preventDefault();
            const id = document.getElementById('cliId').value;
            const payload = {
                nome: document.getElementById('cliNome').value.trim(),
                telefone: document.getElementById('cliTelefone').value.trim(),
                cpf: document.getElementById('cliCpf').value.trim(),
                endereco: document.getElementById('cliEndereco').value.trim(),
                nome_pet: document.getElementById('cliPet').value.trim(),
                especie_pet: document.getElementById('cliEspecie').value,
                observacoes: document.getElementById('cliObs').value.trim()
            };

            const url = id ? ('/api/clientes/' + id) : '/api/clientes';
            const method = id ? 'PUT' : 'POST';

            const resp = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (resp.ok) {
                fecharModalCliente();
                carregarClientes();
            }
        }

        async function excluirCliente(id) {
            if (!confirm('Tem certeza que deseja excluir este cliente?')) return;
            const resp = await fetch('/api/clientes/' + id, { method: 'DELETE' });
            if (resp.ok) carregarClientes();
        }

        // Controle de Sessão e Permissões
        const usuarioLogado = JSON.parse(localStorage.getItem('agro_jl_usuario'));
        if (!usuarioLogado) {
            window.location.href = '/';
        } else {
            document.getElementById('nomeOperadorHeader').innerText = usuarioLogado.nome;
            document.getElementById('perfilOperadorHeader').innerText = usuarioLogado.perfil === 'admin' ? 'Administrador' : 'Vendedor';

            if (usuarioLogado.perfil === 'vendedor') {
                document.querySelectorAll('nav a').forEach(link => {
                    const href = link.getAttribute('href');
                    if (href === '/produtos' || href === '/relatorios') {
                        link.style.display = 'none';
                    }
                });
            }
        }

        function trocarUsuario() {
            localStorage.removeItem('agro_jl_usuario');
            window.location.href = '/';
        }

        carregarClientes();
    </script>
</body>
</html>
